name: QiwiSnake
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest # Самый быстрый приоритет в очереди
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Используем стабильную версию для новых серверов

      - name: Install Dependencies
        run: |
          sudo apt update
          # Устанавливаем всё, включая Java 17 и нужные библиотеки
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev openjdk-17-jdk
          pip install --upgrade pip
          pip install buildozer cython Kivy

      - name: Build with Buildozer
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          # Авто-принятие лицензий и запуск
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QiwiSnake-App
          path: bin/*.apk
